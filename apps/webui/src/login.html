<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Trunk — Login</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#EF5A3C" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f8f8fa;
      --page-fg: #1a1a2e;
      --card-bg: rgba(255, 255, 255, 0.86);
      --card-border: rgba(228, 228, 232, 0.9);
      --card-shadow: 0 32px 96px oklch(65.944% 0.1895 33.247 / 0.14), 0 16px 40px oklch(65.944% 0.1895 33.247 / 0.08);
      --subtitle: rgba(26, 26, 46, 0.56);
      --input-bg: rgba(255, 255, 255, 0.72);
      --input-border: rgba(212, 212, 216, 0.95);
      --placeholder: rgba(26, 26, 46, 0.34);
      --accent: oklch(65.944% 0.1895 33.247);
      --accent-hover: oklch(60% 0.19 33.247);
      --ambient-strong: oklch(65.944% 0.1895 33.247 / 0.18);
      --ambient-soft: oklch(65.944% 0.1895 33.247 / 0.1);
      --grain-1: oklch(65.944% 0.1895 33.247 / 0.055);
      --grain-2: oklch(65.944% 0.1895 33.247 / 0.03);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-fg: #b91c1c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: var(--page-bg);
      color: var(--page-fg);
      padding: 16px;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      inset: -18%;
      background:
        radial-gradient(circle at 18% 20%, var(--ambient-strong) 0, transparent 34%),
        radial-gradient(circle at 82% 18%, var(--ambient-soft) 0, transparent 28%),
        radial-gradient(circle at 76% 76%, oklch(65.944% 0.1895 33.247 / 0.16) 0, transparent 34%),
        radial-gradient(circle at 30% 78%, oklch(65.944% 0.1895 33.247 / 0.11) 0, transparent 30%);
      filter: blur(44px);
      opacity: 0.95;
      transform: scale(1.08);
      animation: drift 24s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(circle at center, oklch(65.944% 0.1895 33.247 / 0.06), transparent 58%),
        repeating-linear-gradient(135deg, var(--grain-1) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(45deg, var(--grain-2) 0 1px, transparent 1px 11px);
      opacity: 0.45;
      mix-blend-mode: multiply;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 28rem;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      color: var(--page-fg);
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 20rem;
      font-size: 13px;
      line-height: 1.5;
      color: var(--subtitle);
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--page-fg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(65.944% 0.1895 33.247 / 0.1);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: white;
      background: linear-gradient(180deg, oklch(70% 0.17 33.247) 0%, var(--accent) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, background 0.15s;
      box-shadow: 0 10px 24px oklch(65.944% 0.1895 33.247 / 0.28);
    }

    button:hover {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-hover) 100%);
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-fg);
    }

    .error.visible { display: block; }

    @keyframes drift {
      from { transform: scale(1.08) translate3d(-2%, -1%, 0); }
      to { transform: scale(1.12) translate3d(2%, 1.5%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      button {
        transition: background 0.15s;
      }

      button:hover {
        transform: none;
        filter: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f0f14;
        --page-fg: #e0e0e8;
        --card-bg: rgba(26, 26, 34, 0.82);
        --card-border: rgba(42, 42, 53, 0.95);
        --card-shadow: 0 32px 96px rgba(0, 0, 0, 0.42), 0 16px 40px rgba(0, 0, 0, 0.24);
        --subtitle: rgba(224, 224, 232, 0.64);
        --input-bg: rgba(15, 15, 20, 0.72);
        --input-border: rgba(42, 42, 53, 0.95);
        --placeholder: rgba(224, 224, 232, 0.32);
        --ambient-strong: oklch(65.944% 0.1895 33.247 / 0.22);
        --ambient-soft: oklch(65.944% 0.1895 33.247 / 0.12);
        --grain-1: oklch(65.944% 0.1895 33.247 / 0.06);
        --grain-2: oklch(65.944% 0.1895 33.247 / 0.035);
        --error-bg: #2d1a1a;
        --error-border: #5a2020;
        --error-fg: #f5a0a0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="brand-mark" viewBox="0 0 880 880" aria-label="Trunk" fill="currentColor">
      <path d="M279.679 44.566c-39.268 24.617-74.157 46.405-77.689 48.669C182.498 105.543 34.607 198.071 26.838 202.74c-5.085 2.971-13.137 8.064-18.08 11.176L0 219.576l.283 110.495.423 110.495 30.652 19.241c141.111 88 143.512 89.556 144.359 94.084.566 2.263.848 51.923.707 110.353l-.141 106.11 25.849 16.411C282.928 837.698 350.87 880 352.141 880c1.413 0 17.092-9.762 166.254-103.28 67.942-42.585 206.51-129.312 226.003-141.479 21.612-13.44 51.133-31.974 60.456-37.916 5.226-3.254 11.724-7.216 14.408-8.772 2.683-1.556 17.374-10.752 32.488-20.231l27.544-17.402.424-110.496L880 329.929l-9.464-6.083c-5.367-3.254-12.713-8.065-16.668-10.47C811.352 286.212 353.13 0 352.141 0c-.706 0-33.335 20.09-72.462 44.566Zm-83.48 77.672c8.899 5.518 22.742 14.148 30.793 19.241 8.051 5.093 25.143 15.846 38.138 23.91 13.136 8.064 26.979 16.695 30.793 19.241 3.955 2.547 10.311 6.508 14.125 8.913 79.666 49.943 175.576 110.071 197.047 123.37 15.114 9.479 44.494 27.73 65.258 40.746 20.764 13.016 58.761 36.643 84.328 52.63l46.613 29.004.141 110.07c0 87.717-.424 109.93-1.695 109.081-2.26-1.274-55.936-34.663-121.053-75.409-27.544-17.26-50.568-31.267-51.274-31.267-.565 0-1.13 49.094-1.13 108.939v109.081l-3.108-1.698c-3.108-1.556-37.997-23.344-128.257-79.794l-43.082-27.023-.423-110.353-.283-110.354-67.518-42.302c-37.008-23.203-76.7-48.103-88.142-55.036l-20.764-12.874-.141-110.071c0-87.717.424-109.929 1.836-109.08.848.565 8.899 5.517 17.798 11.035Z"></path>
    </svg>
    <h1>Trunk</h1>
    <p class="subtitle">Enter your server token to continue</p>

    <form id="login-form">
      <label for="password">Server Token</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter CRAFT_SERVER_TOKEN"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit" id="submit-btn">Sign In</button>
    </form>

    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const password = document.getElementById('password').value;
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Authentication failed';
        errorEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
